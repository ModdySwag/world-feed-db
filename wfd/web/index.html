<!doctype html>
<html lang="en" data-accent="teal" data-motion="full" data-tile="md">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<title>World Feed DB — local viewer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='7' fill='%232dd4bf'/%3E%3C/svg%3E">
<!-- vendored only — no runtime CDN (viewer law #3) -->
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="vendor/leaflet/MarkerCluster.css">
<link rel="stylesheet" href="vendor/leaflet/MarkerCluster.Default.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<noscript><div class="noscript">World Feed DB viewer needs JavaScript.</div></noscript>

<!-- ── top bar ─────────────────────────────────────────────────────────── -->
<header id="topbar">
  <div class="brand" title="World Feed DB — local registry viewer">
    <span class="logo-dot" id="logo-dot"></span>
    <span class="brand-name">World Feed DB</span>
    <span class="brand-count" id="topbar-total" title="registry rows">·</span>
  </div>
  <nav id="menubar" class="menubar" aria-label="Main menu"></nav>
  <label class="topbar-search" title="Search cameras ( / )">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="global-q" type="search" placeholder="Search cameras…" autocomplete="off" spellcheck="false" aria-label="Search cameras">
    <kbd>/</kbd>
  </label>
  <div class="topbar-actions">
    <button type="button" id="btn-favs" class="tb-btn" title="Favourites — Personal view (f to favourite the selected camera)">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      <span id="fav-count">0</span>
    </button>
    <button type="button" id="btn-sound" class="tb-btn" title="Sound on/off (m)"></button>
    <button type="button" id="btn-settings" class="tb-btn" title="Settings">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>
</header>

<!-- ── shell: sidebar + view ───────────────────────────────────────────── -->
<div id="shell">
  <aside id="sidebar" aria-label="Filters">
    <div id="sidebar-chips" class="side-chips"></div>
    <div id="sidebar-sections" class="side-sections"></div>
  </aside>
  <button type="button" id="sidebar-handle" title="Collapse/expand sidebar" aria-label="Toggle sidebar">
    <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
  </button>
  <main id="main">
    <section id="view" class="view" aria-label="Content"></section>
  </main>
</div>

<!-- ── status bar ──────────────────────────────────────────────────────── -->
<footer id="statusbar">
  <span id="sb-health" class="sb-dot" title="API health — connecting…"></span>
  <span id="sb-total" class="sb-item">connecting…</span>
  <span id="sb-gate" class="sb-item"></span>
  <span id="sb-filters" class="sb-item sb-filters"></span>
  <span class="sb-right">
    <span id="sb-prefs" class="sb-item" title="Viewer preferences (favourites + settings)">prefs</span>
    <span id="sb-version" class="sb-item" title="frontend build v0.3">viewer v0.3</span>
  </span>
</footer>

<!-- ── drawer: row detail ──────────────────────────────────────────────── -->
<aside id="drawer" class="drawer" aria-hidden="true">
  <div class="drawer-head">
    <div class="drawer-heading">
      <div class="drawer-title" id="drawer-title">Camera</div>
      <div class="drawer-sub" id="drawer-sub"></div>
    </div>
    <button type="button" id="drawer-close" class="xbtn" title="Close (Esc)" aria-label="Close">&times;</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>

<!-- ── overlay layer ───────────────────────────────────────────────────── -->
<div id="modal-warn" class="overlay" hidden>
  <div class="overlay-card warn-card" role="alertdialog" aria-modal="true" aria-labelledby="warn-title">
    <div class="warn-ico" aria-hidden="true">&#9888;&#xfe0e;</div>
    <div class="overlay-title" id="warn-title">Unsecured camera — read before continuing</div>
    <p class="warn-text" id="warn-text"></p>
    <p class="warn-meta" id="warn-src"></p>
    <p class="warn-note">Metadata only: no preview, no autoplay and no stream URL will be shown for this entry. This registry never contacts the device.</p>
    <div class="overlay-actions">
      <button type="button" id="warn-cancel" class="btn ghost">Cancel</button>
      <button type="button" id="warn-continue" class="btn warn">I understand — show metadata</button>
    </div>
  </div>
</div>

<div id="modal-settings" class="overlay" hidden>
  <div class="overlay-card settings-card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="overlay-head">
      <div class="overlay-title" id="settings-title">Settings</div>
      <button type="button" class="xbtn" data-close="modal-settings" title="Close (Esc)">&times;</button>
    </div>
    <div class="overlay-body" id="settings-body"></div>
  </div>
</div>

<div id="modal-help" class="overlay" hidden>
  <div class="overlay-card help-card" role="dialog" aria-modal="true" aria-labelledby="help-title">
    <div class="overlay-head">
      <div class="overlay-title" id="help-title">Help &amp; guide</div>
      <button type="button" class="xbtn" data-close="modal-help" title="Close (Esc)">&times;</button>
    </div>
    <div class="help-layout">
      <nav class="help-nav" id="help-nav" aria-label="Help sections"></nav>
      <div class="overlay-body help-body" id="help-body"></div>
    </div>
  </div>
</div>

<div id="modal-player" class="overlay" hidden>
  <div class="overlay-card player-card" role="dialog" aria-modal="true" aria-labelledby="player-title">
    <div class="overlay-head">
      <div class="overlay-title" id="player-title">Player</div>
      <div class="overlay-head-side">
        <span id="player-chip"></span>
        <button type="button" class="xbtn" data-close="modal-player" title="Close (Esc)">&times;</button>
      </div>
    </div>
    <div class="player-host" id="player-host"></div>
  </div>
</div>

<div id="palette" class="overlay palette-overlay" hidden>
  <div class="palette" role="dialog" aria-modal="true" aria-label="Command palette">
    <input id="palette-input" type="text" placeholder="Type a command, or text to search cameras…" autocomplete="off" spellcheck="false" aria-label="Command palette input">
    <div id="palette-list" class="palette-list" role="listbox"></div>
    <div class="palette-foot"><span>&uarr;&darr; navigate</span><span>&crarr; run</span><span>esc close</span></div>
  </div>
</div>

<div id="toasts" class="toasts" aria-live="polite" aria-relevant="additions"></div>

<!-- vendored libraries (classic scripts, loaded before the module boots) -->
<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/leaflet/leaflet.markercluster.js"></script>
<script src="vendor/hls/hls.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
