<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

	<title>Video Player</title>
	<script src="//ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js" type="text/javascript"></script>

	<link href="https://unpkg.com/video.js@5.16.0/dist/video-js.css" rel="stylesheet">
	<script src="https://unpkg.com/video.js@5.16.0/dist/video.js"></script>
	<script src="https://unpkg.com/videojs-contrib-hls@4.1.1/dist/videojs-contrib-hls.js"></script>  <!-- If you'd like to support IE8 -->

		href="/video/css/style.css" />

	<style type="text/css">
body {
	background:#FFF;
	color:#333;
	font-family:Verdana,Tahoma,"BitStream vera Sans",Arial,Helvetica,sans-serif;
	font-size:12px;
	margin: 0px;
	padding: 0px;
}

#video {
width: 100%;
height: 100%;
}

#video-overlay {
	width: 50px;
	height: 50px;
}

#play-pause-overlay {
	border: none;
	background: none;
}

#play-pause-overlay .icon {
	width: 50px;
	height: 50px;
	background: url('/video/images/play-pause.png');
}

#play-pause-overlay.player-stop .icon {
	background-position: 0 -50px;
}

#play-pause {
	padding: 0px;
	border: none;
	float: left;
}

#play-pause .icon {
	width: 25px;
	height: 25px;
	background: url('/video/images/play-pause-small.png');
}

#play-pause.player-stop .icon {
	background-position: 0 -25px;
}

#play-pause .pause {
	display: none;
}

#play-pause .play {
	display: block;
}

#play-pause.player-stop .pause {
	display: block;
}

#play-pause.player-stop .play {
	display: none;
}

#progressbar {
  background-color: black;
  border-radius: 13px; /* (height of inner div) / 2 + padding */
  padding: 3px;
  margin-left: 30px;
  height: 19px;
}

#progressbar .progress {
   background-color: darkred;
   width: 0;
   height: 19px;
   border-radius: 10px;
}
#progressbar .text {
	width: 50px;
	margin: -20px auto 0;
	color: #fff;
	height: 20px;
	line-height: 20px;
	vertical-align: middle;
}

#control-container {
	margin-top: 2px;
	margin-left: 5px;
	position: relative;
}

#player-area {
		width: 100%;
		height: 163.125px;
	}
#page-content {
	width: 100%;
	margin: auto;
}

@media (min-width: 320px) {
	#player-area {
		width:320px;
		height: 180.0px;
	}
	#page-content {
		width: 320px;
	}
}	
	
@media (min-width: 480px) {
	#player-area {
		width:100%;
		height: 270.0px;
	}
	#page-content {
		width: 100%;
	}
}

@media (min-width: 640px) {
	#player-area {
		width:100%;
		height: 360.0px;
	}
	#page-content {
		width: 100%;
	}
}

@media (min-width: 768px) {
	#player-area {
		width:100%;
		height: 432.0px;
	}
	#page-content {
		width: 100%;
	}
}

@media (min-width: 1024px) {
	#player-area {
		width:100%;
		height: 576.0px;
	}
	#page-content {
		width: 100%;
	}
}
@media (min-width: 1280px) {
	#player-area {
		width: 100%;
		height: 720.0px;
	}
	#page-content {
		width: 100%;
	}
}
</style>



<script type="text/javascript">

function drive_camera(pos) {
	$.post('?method=drive', {'pos':pos});
}

</script>
</head>
<body>
<div id="page-content">

<div id="player-area">
<video class="video-js" controls autoplay muted preload="auto" id="video" data-setup='{"ga": {"eventsToTrack": ["play"]}}'  >
<source type="application/x-mpegURL" src="https://d1nm4r8e5x1rwd.cloudfront.net/cw/coffsjettybeachcamera.stream/playlist.m3u8" />
</video>
</div>


<div class="alert alert-info" role="alert">We are experiencing some technical issues with this camera, so the vision may be unavailable.</div>


</div>

</html>
